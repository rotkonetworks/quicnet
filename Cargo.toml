[package]
name = "quicnet"
version = "0.2.2"
edition = "2024"
authors = ["rotko networks"]
license = "MIT OR Apache-2.0"
description = "minimal peer-to-peer network protocol over QUIC"
repository = "https://github.com/rotkonetworks/quicnet"
keywords = ["quic", "p2p", "networking", "ed25519"]
categories = ["network-programming", "command-line-utilities"]

[lib]
name = "quicnet"
path = "src/lib.rs"

[[bin]]
name = "quicnet"
path = "src/bin/quicnet.rs"

[dependencies]
# core transport & tls
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "io-std", "net", "macros", "fs"] }

# crypto
ed25519-dalek = { version = "2", features = ["pkcs8"] }
rand = "0.8"
ssh-key = { version = "0.6", features = ["ed25519", "encryption"] }
rpassword = "7"

# encoding
base64 = "0.22"
bs58 = "0.5"
b256 = "0.4.1"
hex = "0.4"

# certificates / x509
rcgen = "0.14"
x509-parser = "0.18"

# cli
clap = { version = "4", features = ["derive"] }

# filesystem
dirs = "5"

# error handling
anyhow = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
parking_lot = "0.12"

# logging
chrono = "0.4"

# webtransport deps (optional feature)
h3 = { git = "https://github.com/hyperium/h3", rev = "0e54a16", optional = true }
h3-quinn = { git = "https://github.com/hyperium/h3", rev = "0e54a16", features = ["datagram"], optional = true }
h3-webtransport = { git = "https://github.com/hyperium/h3", rev = "0e54a16", optional = true }
h3-datagram = { git = "https://github.com/hyperium/h3", rev = "0e54a16", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

# remote session deps
x11rb = { version = "0.13", features = ["all-extensions", "composite", "damage", "shm"], optional = true }
x11 = { version = "2.21", optional = true }
webp = { version = "0.3", optional = true }
minifb = { version = "0.27", optional = true }

# video streaming deps
openh264 = { version = "0.9", optional = true }
image = { version = "0.25", optional = true }
yuv = { version = "0.8.8", optional = true }
h264-reader = { version = "0.6", optional = true }
libc = "0.2"

# hardware video encoding
gstreamer = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
drm = { version = "0.12", optional = true }
nix = { version = "0.29", optional = true }


[features]
default = []
webtransport = ["h3", "h3-quinn", "h3-webtransport", "h3-datagram", "bytes", "http", "sha2", "time", "x11rb", "x11", "webp", "minifb", "gstreamer", "gstreamer-video", "gstreamer-app", "drm", "nix"]
remote = ["x11rb", "webp", "minifb"]
hardware = ["gstreamer", "gstreamer-video", "gstreamer-app", "drm", "nix"]
video = ["openh264", "image", "x11rb", "yuv", "h264-reader"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[[example]]
name = "shell_server"
path = "examples/shell_server.rs"

[[example]]
name = "chat_client"
path = "examples/chat_client.rs"

[[example]]
name = "chat_server"
path = "examples/chat_server.rs"

[[example]]
name = "remote_session"
path = "examples/remote_session.rs"

[[example]]
name = "hardware_remote"
path = "examples/hardware_remote.rs"

[dependencies.instant-acme]
version = "0.7"

[dependencies.rustls-pemfile]
version = "2"

[dependencies.time]
version = "0.3"
features = ["formatting", "macros"]
optional = true
